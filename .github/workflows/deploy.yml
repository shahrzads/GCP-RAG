name: Deploy

on:
  pull_request:
    branches:
      - dev
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE_NAME="${IMAGE_NAME:-gcp-rag-demo}"
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}"
          docker build -t "${IMAGE_URI}:${DEPLOY_SHA}" .
          docker push "${IMAGE_URI}:${DEPLOY_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            docker tag "${IMAGE_URI}:${DEPLOY_SHA}" "${IMAGE_URI}:latest"
            docker push "${IMAGE_URI}:latest"
          fi

      - name: Deploy to Cloud Run
        run: |
          IMAGE_NAME="${IMAGE_NAME:-gcp-rag-demo}"
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}"
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_URI}:${DEPLOY_SHA}" \
            --quiet
