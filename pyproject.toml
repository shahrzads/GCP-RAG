[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-rag-demo"
version = "0.1.0"
description = "Interview-friendly first iteration of a simple RAG system on Google Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-aiplatform>=1.71.0",
  "google-cloud-storage>=2.18.0",
  "google-genai",
  "langchain-text-splitters>=1.1.1",
  "pypdf",
  "python-dotenv>=1.0.1",
  "streamlit",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
gcp-rag = "gcp_rag_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
